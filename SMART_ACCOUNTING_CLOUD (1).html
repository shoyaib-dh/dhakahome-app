<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root{
    --red:#C21F26;
    --red-dark:#8F1519;
    --red-light:#FDEBEC;
    --black:#141416;
    --charcoal:#232326;
    --line:#E7E5E2;
    --paper:#FBFAF8;
    --white:#FFFFFF;
    --ink:#1B1B1D;
    --ink-soft:#6B6B70;
    --green:#1E8E3E;
    --green-bg:#E7F6EC;
    --amber:#B8860B;
    --amber-bg:#FBF3E2;
    --blue:#1D5FBF;
    --blue-bg:#E9F0FC;
    --radius:10px;
    --shadow: 0 1px 2px rgba(20,20,22,.04), 0 6px 20px rgba(20,20,22,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Arial, Calibri, 'Segoe UI', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Courier New',monospace;}
  h1,h2,h3,.disp,.brand .name,.co,.rtitle .t{font-family:'Poppins',Arial,Calibri,sans-serif;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}

  .sidebar{
    width:250px; flex-shrink:0; background:var(--black);
    color:#EDEDEE; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 20px 18px; border-bottom:1px solid #2A2A2D;
  }
  .brand .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px;height:34px;border-radius:8px;background:var(--red);
    font-family:'Poppins';font-weight:800;color:#fff;font-size:15px;margin-bottom:10px;
  }
  .brand .name{font-weight:700;font-size:16.5px;letter-spacing:.2px;color:#fff;}
  .brand .tag{font-size:11px;color:#9C9CA1;margin-top:2px;letter-spacing:.4px;text-transform:uppercase;}

  .nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .nav button{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:10px 12px;border-radius:8px;font-size:14px;color:#C7C7CC;font-weight:500;
    transition:background .15s, color .15s;
  }
  .nav button svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav button:hover{background:#1F1F22;color:#fff;}
  .nav button.active{background:var(--red);color:#fff;}
  .nav .section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6F6F75;padding:14px 12px 4px;font-weight:600;}

  .sidebar-foot{padding:14px 18px;border-top:1px solid #2A2A2D;font-size:11px;color:#78787D;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--white);border-bottom:1px solid var(--line);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;}
  .topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .content{padding:24px 28px 60px; flex:1;}

  /* ---------- Buttons ---------- */
  .btn{
    all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
    transition:transform .06s, background .15s, box-shadow .15s;
    font-family:Arial, Calibri, sans-serif;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(194,31,38,.25);}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-dark{background:var(--black);color:#fff;}
  .btn-dark:hover{background:#000;}
  .btn-ghost{background:var(--white);color:var(--ink);border:1px solid var(--line) !important;box-shadow:none;}
  .btn-ghost:hover{background:#F3F2EF;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red-light);}
  .btn-danger:hover{background:var(--red-light);}
  .icon-btn{all:unset;cursor:pointer;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--ink-soft);}
  .icon-btn:hover{background:#F0EFEC;color:var(--ink);}

  /* ---------- Cards / KPIs ---------- */
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .kpi .label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .kpi .val{font-family:'Poppins';font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);}
  .kpi.k-black .bar{background:var(--black);}
  .kpi.k-green .bar{background:var(--green);}
  .kpi.k-amber .bar{background:var(--amber);}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card-head h3{margin:0;font-size:15.5px;font-weight:700;}
  .card-body{padding:18px 20px;}

  /* ---------- Table (screen) ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:700;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:#FAF9F6;}
  .tbl-wrap{overflow-x:auto;}
  .num{font-family:'Courier New',monospace;font-variant-numeric:tabular-nums;text-align:right;}
  tfoot td{font-weight:700;border-top:2px solid var(--black);border-bottom:none;background:#FAF9F6;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge .dot{width:7px;height:7px;border-radius:50%;}
  .badge-avail{background:var(--green-bg);color:var(--green);}
  .badge-avail .dot{background:var(--green);animation:dotPulseGreen 1.8s ease-in-out infinite;}
  .badge-unavail{background:var(--red-light);color:var(--red-dark);}
  .badge-unavail .dot{background:var(--red);animation:dotPulseRed 1.8s ease-in-out infinite;}
  @keyframes dotPulseGreen{
    0%,100%{ box-shadow:0 0 0 0 rgba(30,142,62,.45); }
    50%{ box-shadow:0 0 0 5px rgba(30,142,62,0); }
  }
  @keyframes dotPulseRed{
    0%,100%{ box-shadow:0 0 0 0 rgba(194,31,38,.4); }
    50%{ box-shadow:0 0 0 5px rgba(194,31,38,0); }
  }
  .badge{transition:transform .15s ease, box-shadow .15s ease;}
  .badge[onclick]:hover{transform:translateY(-1px) scale(1.03);}
  .card{animation:fadeUp .25s ease both;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .kpi{animation:fadeUp .3s ease both;}
  .badge-clean-ok{background:var(--green-bg);color:var(--green);}
  .badge-clean-warn{background:var(--amber-bg);color:var(--amber);}
  .badge-clean-bad{background:var(--red-light);color:var(--red-dark);}

  /* ---------- Forms ---------- */
  label{display:block;font-size:12.5px;font-weight:600;color:#48484D;margin-bottom:5px;}
  input,select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;font-family:Arial, Calibri, sans-serif;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-light);}
  .field{margin-bottom:13px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,20,22,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .15s ease;}
  .modal.wide{max-width:800px;}
  @keyframes pop{from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:16px;font-weight:700;}
  .modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
  .close-x{all:unset;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);border-radius:6px;}
  .close-x:hover{background:#F0EFEC;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty svg{opacity:.35;margin-bottom:10px;}
  .empty .t{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:4px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--black);color:#fff;padding:12px 18px;border-radius:9px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);}
  .toast.err::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);}

  .month-nav{display:flex;align-items:center;gap:8px;}
  .month-nav button{background:#F3F2EF;}
  .month-label{font-weight:700;font-size:14px;min-width:130px;text-align:center;font-family:'Poppins';}

  /* Receipt document look (screen) */
  .receipt-doc{background:#fff;padding:34px 34px 26px;}
  .receipt-doc .rhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:20px;}
  .receipt-doc .rhead .co{font-weight:800;font-size:20px;color:var(--black);}
  .receipt-doc .rhead .co span{color:var(--red);}
  .receipt-doc .rhead .meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .receipt-doc .rtitle{text-align:right;}
  .receipt-doc .rtitle .t{font-weight:800;font-size:16px;letter-spacing:1px;color:var(--black);text-transform:uppercase;}
  .receipt-doc .rtitle .no{font-size:12px;color:var(--ink-soft);font-family:'Courier New',monospace;margin-top:3px;}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
  .rgrid .box{background:#FAF9F6;border-radius:8px;padding:12px 14px;border:1px solid var(--line);}
  .rgrid .box h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
  .rgrid .box .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .rgrid .box .row b{font-weight:600;}
  .rtable{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .rtable th{background:#EFEFEF;color:#111;font-size:11.5px;text-transform:uppercase;padding:8px 10px;text-align:left;border:1px solid #333;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .rtable td{padding:9px 10px;border:1px solid var(--line);font-size:13.5px;}
  .rtotal{display:flex;justify-content:flex-end;}
  .rtotal table{width:280px;}
  .rtotal td{padding:6px 4px;font-size:13.5px;}
  .rtotal tr.grand td{border-top:2px solid var(--black);font-weight:800;font-size:15px;padding-top:9px;}
  .rfoot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .sign{margin-top:40px;display:flex;justify-content:space-between;}
  .sign .ln{width:180px;border-top:1px solid #999;padding-top:6px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

  /* ---------- PRINT: bordered, ruled tables with margins ---------- */
  @media print{
    @page{ margin: 14mm 12mm; }
    html, body{ height:auto !important; }
    /* Fully remove (not just hide) the app shell and login screen so their height
       never adds blank pages after the printed content. */
    #app, #loginScreen, .offline-banner, .toast, .sidebar-backdrop{ display:none !important; }
    /* Neutralize the modal/overlay chrome so any modal-based printArea behaves
       like a normal static block instead of a full-viewport fixed layer
       (fixed/absolute full-height layers are what caused extra blank pages). */
    .overlay{ position:static !important; inset:auto !important; height:auto !important; min-height:0 !important;
      padding:0 !important; margin:0 !important; overflow:visible !important; background:none !important; display:block !important; }
    .modal{ max-width:100% !important; width:100% !important; box-shadow:none !important; border-radius:0 !important; margin:0 !important; animation:none !important; }
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:100%;}
    .no-print{display:none !important;}
    #printArea table{width:100%;border-collapse:collapse;font-family:Arial, Calibri, sans-serif;}
    #printArea th, #printArea td{
      border:1px solid #333 !important;
      padding:6px 8px !important;
      font-size:12px;
    }
    #printArea th{background:#EFEFEF !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    #printArea .rtable th{background:#EFEFEF !important; color:#111 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    #printArea tfoot td{border-top:2px solid #000 !important; font-weight:700;}
    #printArea .rhead{border-bottom:3px solid #C21F26 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }

  @media (max-width:900px){
    .sidebar{position:fixed;left:-270px;transition:left .25s ease;z-index:99;box-shadow:0 0 0 rgba(0,0,0,0);}
    .sidebar.open{left:0;box-shadow:8px 0 24px rgba(0,0,0,.25);}
    .field-row,.field-row3{grid-template-columns:1fr;}
    .rgrid{grid-template-columns:1fr;}
    .content{padding:16px 14px 50px;}
    .topbar{padding:12px 14px;}
    .topbar h1{font-size:16.5px;}
    .grid-kpi{grid-template-columns:repeat(2,1fr);gap:10px;}
    .kpi{padding:14px 12px;}
    .kpi .val{font-size:20px;}
    .card-head{padding:13px 14px;}
    .card-body{padding:14px;}
    .modal{max-width:100% !important;margin:0 8px;}
  }
  .menu-btn{display:none;}
  @media (max-width:900px){.menu-btn{display:inline-flex;}}
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(10,10,12,.5);
    z-index:98; opacity:0; transition:opacity .2s ease;
  }
  @media (max-width:900px){
    .sidebar-backdrop.show{display:block; opacity:1;}
  }
  .sidebar-close{display:none;}
  @media (max-width:900px){
    .sidebar-close{
      display:inline-flex; align-items:center; justify-content:center;
      width:30px;height:30px;border-radius:7px;color:#C7C7CC;background:transparent;
      border:none;cursor:pointer;font-size:18px;position:absolute;top:20px;right:14px;
    }
    .sidebar-close:hover{background:#1F1F22;color:#fff;}
    .brand{position:relative;}
  }

  /* ========== LOGIN / AUTH STYLES ========== */
  #loginScreen {
    position:fixed; inset:0; background:linear-gradient(135deg,#141416 0%,#1e1e22 50%,#0a0a0c 100%);
    display:flex; align-items:center; justify-content:center; z-index:9999;
  }
  #loginScreen.hidden { display:none; }
  .login-box {
    background:#fff; border-radius:16px; padding:36px 32px; width:100%; max-width:400px;
    box-shadow:0 24px 80px rgba(0,0,0,.5);
  }
  .login-logo { text-align:center; margin-bottom:24px; }
  .login-logo .mark {
    display:inline-flex;align-items:center;justify-content:center;
    width:48px;height:48px;border-radius:12px;background:#C21F26;
    font-family:'Poppins';font-weight:800;color:#fff;font-size:22px;margin-bottom:10px;
  }
  .login-logo .brand-name { font-family:'Poppins';font-weight:800;font-size:20px;color:#141416; }
  .login-logo .brand-sub { font-size:12px;color:#9C9CA1;text-transform:uppercase;letter-spacing:.5px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block;font-size:12.5px;font-weight:600;color:#48484D;margin-bottom:5px; }
  .login-field input {
    width:100%;padding:10px 12px;border:1px solid #E7E5E2;border-radius:8px;
    font-size:14px;outline:none;box-sizing:border-box;
  }
  .login-field input:focus { border-color:#C21F26;box-shadow:0 0 0 3px #FDEBEC; }
  .login-btn {
    width:100%;padding:11px;background:#C21F26;color:#fff;border:none;border-radius:8px;
    font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;font-family:Arial,sans-serif;
  }
  .login-btn:hover { background:#8F1519; }
  .login-err { color:#C21F26;font-size:12.5px;margin-top:8px;text-align:center;display:none; }
  .login-err.show { display:block; }
  .login-footer { text-align:center;margin-top:16px;font-size:11.5px;color:#9C9CA1; }

  /* sync status indicator */
  #syncStatus {
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#9C9CA1;padding:4px 8px;
    border-radius:20px;background:#F3F2EF;
  }
  #syncStatus .dot { width:7px;height:7px;border-radius:50%;background:#9C9CA1; }
  #syncStatus.syncing .dot { background:#B8860B;animation:pulse 1s infinite; }
  #syncStatus.synced .dot { background:#1E8E3E; }
  #syncStatus.err .dot { background:#C21F26; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* user management panel */
  .user-avatar {
    display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50%;background:var(--red,#C21F26);
    color:#fff;font-weight:700;font-size:15px;cursor:pointer;flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .user-avatar:hover { filter:brightness(1.08); }
  .role-admin { color:#C21F26; }
  .role-user { color:#1D5FBF; }
  .offline-banner {
    background:#B8860B;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;
    display:none;
  }
  .offline-banner.show { display:block; }
</style>
</head>
<body>

<!-- OFFLINE BANNER -->
<div class="offline-banner" id="offlineBanner">⚠ You are currently offline — data is being saved locally and will sync once you're back online.</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="mark">DH</div>
      <div class="brand-name">DhakaHome</div>
      <div class="brand-sub">Smart Accounting</div>
    </div>
    <div id="loginForm">
      <div class="login-field"><label>Username</label><input type="text" id="loginUser" placeholder="shoyaibaccounting" autocomplete="username"></div>
      <div class="login-field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="login-err" id="loginErr"></div>
      <button class="login-btn" onclick="doLogin()">Log In</button>
    </div>
    <div class="login-footer">DhakaHome USA Ltd. &copy; 2026</div>
  </div>
</div>

<!-- MAIN APP (hidden until logged in) -->
<div id="app" style="display:none; flex-direction:row;">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">DH</div>

// ====================== SIMPLE HASH (for password) ======================
async function hashPassword(pass) {
  const enc = new TextEncoder().encode(pass + 'dh_salt_2026');
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function setSyncStatus(state, label){

// ====================== FIRESTORE SYNC ======================
function startCloudSync(userId){
  if(firestoreUnsubscribe) firestoreUnsubscribe();
  setSyncStatus('syncing','Connecting...');
  const docRef = db.collection('accounting_data').doc('main_db');
  firestoreUnsubscribe = docRef.onSnapshot(snap=>{
    if(snap.exists){
      const data = snap.data();
      Object.assign(DB, data);
      saveLocal(DB);
      if(currentPage) render();
      setSyncStatus('synced','Cloud ✓ Synced');
    } else {
      // First time — push local data
      docRef.set(DB).catch(e=>console.error(e));
      setSyncStatus('synced','Cloud ✓ New');
    }
  }, err=>{
    console.error('Firestore error:', err);
    setSyncStatus('err','Offline mode');
  });
}

function persist(part){
  if(part){
    // already updated in memory, just sync
  }
  saveLocal(DB);
  pushToCloud();
}

let pushTimer = null;
function pushToCloud(){
  clearTimeout(pushTimer);
  setSyncStatus('syncing','Saving...');
  pushTimer = setTimeout(async ()=>{
    try{
      await db.collection('accounting_data').doc('main_db').set(DB);
      setSyncStatus('synced','Cloud ✓ Saved');
    }catch(e){
      setSyncStatus('err','Offline — Local only');

  }, 800);
}

async function loadUsers(){
  try{
    const snap = await db.collection('dh_users').get();
    const users = [];
    snap.forEach(doc=>users.push({id:doc.id,...doc.data()}));
    // Ensure admin exists
    if(!users.find(u=>u.username===DEFAULT_ADMIN.username)){
      const hash = await hashPassword(DEFAULT_ADMIN.password);
      await db.collection('dh_users').doc(DEFAULT_ADMIN.username).set({
        username:DEFAULT_ADMIN.username, passwordHash:hash,
        role:'admin', active:true, createdAt:new Date().toISOString()
      });
      users.push({username:DEFAULT_ADMIN.username,role:'admin',active:true});
    }
    return users;
  }catch(e){
    // offline fallback — check local users
    const local = localStorage.getItem('dh_users');
    return local ? JSON.parse(local) : [];
  }
}

async function doLogin(){
  const uname = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.classList.remove('show');
  if(!uname||!pass){ showLoginErr('Please enter Username and Password'); return; }

  const btn = document.querySelector('.login-btn');
  btn.textContent='Verifying...'; btn.disabled=true;

  try{
    const hash = await hashPassword(pass);
    // Check admin default (also works offline first time)
    if(uname===DEFAULT_ADMIN.username && pass===DEFAULT_ADMIN.password){
      loginSuccess({username:uname, role:'admin'});
      return;
    }
    // Check Firestore users
    const doc = await db.collection('dh_users').doc(uname).get();
    if(!doc.exists){ showLoginErr('User not found'); btn.textContent='Log In'; btn.disabled=false; return; }
    const userData = doc.data();
    if(!userData.active){ showLoginErr('This account is inactive'); btn.textContent='Log In'; btn.disabled=false; return; }
    if(userData.passwordHash !== hash){ showLoginErr('Incorrect password'); btn.textContent='Log In'; btn.disabled=false; return; }
    loginSuccess({username:uname, role:userData.role||'user'});
  }catch(e){
    // Offline fallback
    const localUsers = localStorage.getItem('dh_users');
    if(uname===DEFAULT_ADMIN.username && pass===DEFAULT_ADMIN.password){
      loginSuccess({username:uname, role:'admin'}); return;
    }
    showLoginErr('Login failed — please check your internet connection');
    btn.textContent='Log In'; btn.disabled=false;
  }
}

function loginSuccess(user){
  currentUser = user;
  localStorage.setItem('dh_session',JSON.stringify({user, ts:Date.now()}));
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').style.display='flex';
  document.getElementById('currentUserLabel').textContent=user.username;
  const roleLabels = {admin:'👑 Admin', user:'👤 User', cleaner:'🧹 Cleaner', viewer:'👁 Viewer'};
  document.getElementById('currentUserRole').textContent=roleLabels[user.role]||'👤 User';
  document.getElementById('currentUserRole').className=user.role==='admin'?'role-admin':'role-user';
  const avatarEl = document.getElementById('userAvatarInitial');
  if(avatarEl) avatarEl.textContent = (user.username||'?').trim().charAt(0).toUpperCase();
  startCloudSync(user.username);
  seedIfEmpty();
  renderNav();
  goTo(defaultPageForRole());
}

function showLoginErr(msg){
  const el=document.getElementById('loginErr');
  el.textContent=msg; el.classList.add('show');
}

function doLogout(){
  if(!confirm('Log out?')) return;
  if(firestoreUnsubscribe) firestoreUnsubscribe();
  currentUser=null;
  localStorage.removeItem('dh_session');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').style.display='none';
}

// Auto login from session (within 8 hours)
function checkSession(){
  try{
    const s = localStorage.getItem('dh_session');
    if(!s) return false;
    const {user, ts} = JSON.parse(s);
    if(Date.now()-ts < 8*60*60*1000){ loginSuccess(user); return true; }
  }catch(e){}
  return false;
}

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtInt(n){ n=Number(n)||0; return n.toLocaleString('en-US'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ if(!a||!b) return 0; const d1=new Date(a), d2=new Date(b); return Math.max(0, Math.round((d2-d1)/86400000)); }
function niceDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function monthLabel(ym){ if(!ym) return '—'; const [y,m]=ym.split('-'); const d=new Date(Number(y),Number(m)-1,1); return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function curMonth(){ return new Date().toISOString().slice(0,7); }
function shiftMonth(ym, delta){ const [y,m]=ym.split('-').map(Number); const d=new Date(y, m-1+delta, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function toast(msg, type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+(type||'ok');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- Cleaning helpers ---------------- */
function getLastCleaning(flatId){
  const list = DB.cleanings.filter(c=>c.flatId===flatId).sort((a,b)=> b.date.localeCompare(a.date));
  return list[0] || null;
}

/* ---------------- Booking overlap check ---------------- */
function findBookingConflict(flatId, checkIn, checkOut, excludeGuestId){
  return DB.guests.find(g=>{
    if(g.flatId!==flatId) return false;
    if(excludeGuestId && g.id===excludeGuestId) return false;
    // Overlap if new check-in is before existing check-out AND new check-out is after existing check-in.
    // Same-day handover (checkout date == next checkin date) is allowed.
    return (checkIn < g.checkOut) && (checkOut > g.checkIn);
  }) || null;
}

/* ---------------- Guest billing / ledger helpers ---------------- */
function guestDays(g){ return Math.max(1, daysBetween(g.checkIn, g.checkOut)); }
function guestTotalRent(g){
  const days = guestDays(g);
  let base;
  if(g.rentType==='monthly'){
    const months = days/30;
    base = Math.round((Number(g.monthlyRate)||0) * months);
  } else {
    base = days * Number(g.perDayRate||0);
  }
  return base + Number(g.serviceCharge||0);
}
function guestRateLabel(g){
  if(g.rentType==='monthly') return `Tk ${fmt(g.monthlyRate)} / month`;
  return `Tk ${fmt(g.perDayRate)} / day`;
}
function guestLedger(guestId){
  return DB.guestPayments.filter(p=>p.guestId===guestId).sort((a,b)=>a.date.localeCompare(b.date));
}
// Human-readable label for a payment row. "Other" type shows the note itself as the label.
function guestPaymentTypeLabel(p){
  if(p.type==='advance') return 'Advance';
  if(p.type==='rent') return 'Rent Payment';
  if(p.type==='adjustment') return 'Advance → Rent';
  if(p.type==='other') return esc(p.note || 'Other');
  return 'Payment';
}
// Cash actually received from the guest (initial advance at booking + later advance/rent payments). Adjustments move money already received from "advance" to "rent" and are not new cash.
function guestTotalReceived(g){
  const ledger = guestLedger(g.id);
  const later = ledger.filter(p=>p.type==='advance'||p.type==='rent'||p.type==='other').reduce((s,p)=>s+Number(p.amount),0);
  return Number(g.advancePaid||0) + later;
}
// Portion of total-received that has been counted against rent (rent-type payments + adjustments from advance)
function guestRentPaid(g){
  const ledger = guestLedger(g.id);
  return ledger.filter(p=>p.type==='rent'||p.type==='adjustment').reduce((s,p)=>s+Number(p.amount),0);
}
// Advance still sitting unused (not yet adjusted against rent)
function guestAvailableAdvance(g){
  const ledger = guestLedger(g.id);
  const advanceIn = Number(g.advancePaid||0) + ledger.filter(p=>p.type==='advance').reduce((s,p)=>s+Number(p.amount),0);
  const advanceUsed = ledger.filter(p=>p.type==='adjustment').reduce((s,p)=>s+Number(p.amount),0);
  return Math.max(0, advanceIn - advanceUsed);
}
function guestBalanceDue(g){
  return guestTotalRent(g) - guestRentPaid(g);
}

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = currentNav().map(sec => `
    <div class="section-label">${sec.sec}</div>
    ${sec.items.map(it => `<button data-page="${it.id}" class="${currentPage===it.id?'active':''}">${ICONS[it.icon]}${it.label}</button>`).join('')}
  `).join('');
  nav.querySelectorAll('button[data-page]').forEach(b=>{
    b.onclick = ()=>{ goTo(b.dataset.page); closeMobileMenu(); };
  });
}

const PAGE_META = {
  dashboard:['Dashboard','Overall overview & summary'],
  flats:['Flat Management','Properties, availability & cleaning status'],
  cleaning:['Cleaning Schedule','Log which flat was cleaned, when, and by whom'],
  guests:['Guests & Booking','Guest entry, check-in/check-out & money receipt'],
  entries:['Income & Expense Entry','Record monthly income & expense for each flat'],
  houseReport:['House Report','Monthly income/expense summary per flat'],
  ownerReport:['Owner Payment Report','Commission calculation & owner payment breakdown'],
  settings:['Company Settings','Company info and default values']
};

function goTo(page){
  if(!pageAllowed(page)) page = defaultPageForRole();
  currentPage = page;
  document.getElementById('pageTitle').textContent = PAGE_META[page][0];
  document.getElementById('pageSub').textContent = PAGE_META[page][1];
  renderNav();
  render();
}

function render(){
  const c = document.getElementById('content');
  if(currentPage==='dashboard') c.innerHTML = renderDashboard();
  else if(currentPage==='flats') c.innerHTML = renderFlats();
  else if(currentPage==='cleaning') c.innerHTML = renderCleaning();
  else if(currentPage==='guests') c.innerHTML = renderGuests();
  else if(currentPage==='entries') c.innerHTML = renderEntries();
  else if(currentPage==='houseReport') c.innerHTML = renderHouseReport();
  else if(currentPage==='ownerReport') c.innerHTML = renderOwnerReport();
  else if(currentPage==='settings') c.innerHTML = renderSettings();
  bindPageEvents();
}

/* ================= MODAL HELPERS ================= */
function openModal(html, wide){
  document.getElementById('modalBox').className = 'modal' + (wide?' wide':'');
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------------- Mobile sidebar menu (open/close via button, backdrop, or nav click) ---------------- */
function openMobileMenu(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
}
function closeMobileMenu(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}
document.getElementById('menuBtn').addEventListener('click', ()=>{
  const sb = document.getElementById('sidebar');
  sb.classList.contains('open') ? closeMobileMenu() : openMobileMenu();
});
document.getElementById('sidebarClose').addEventListener('click', closeMobileMenu);
document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileMenu);

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const totalFlats = DB.flats.length;
  const avail = DB.flats.filter(f=>f.status==='Available').length;
  const notAvail = totalFlats - avail;
  const cm = curMonth();
  const monthEntries = DB.entries.filter(e=>e.month===cm);
  const totalRent = monthEntries.filter(e=>e.type==='rent').reduce((s,e)=>s+Number(e.amount),0);
  const totalCommon = monthEntries.filter(e=>e.type==='common').reduce((s,e)=>s+Number(e.amount),0);
  const totalOwnerExp = monthEntries.filter(e=>e.type==='owner').reduce((s,e)=>s+Number(e.amount),0);
  const netIncome = totalRent - totalCommon;
  // Compute commission per-flat so fixed-payment flats are handled correctly, not just a blanket %.
  let commission = 0;
  DB.flats.forEach(f=>{
    const list = monthEntries.filter(e=>e.flatId===f.id);
    const rent = list.filter(e=>e.type==='rent').reduce((s,e)=>s+Number(e.amount),0);
    const common = list.filter(e=>e.type==='common').reduce((s,e)=>s+Number(e.amount),0);
    const inc = rent - common;
    if(f.paymentType==='fixed'){ commission += inc - (Number(f.fixedOwnerAmount)||0); }
    else { const pct = f.commissionPct??DB.settings.defaultCommission; commission += inc*(pct/100); }
  });

  const needsCleaning = DB.flats.map(f=>({f, last:getLastCleaning(f.id)}))
    .filter(x=> !x.last || daysBetween(x.last.date, todayISO()) >= 7)
    .sort((a,b)=>{
      const da = a.last? a.last.date : '0000-00-00';
      const db_ = b.last? b.last.date : '0000-00-00';
      return da.localeCompare(db_);
    })
    .slice(0,6);

  const upcoming = DB.guests
    .filter(g=> g.checkOut >= todayISO())
    .sort((a,b)=> a.checkIn.localeCompare(b.checkIn))
    .slice(0,6);

  return `
  <div class="grid-kpi">
    <div class="kpi"><div class="bar"></div><div class="label">Total Flats</div><div class="val">${totalFlats}</div></div>
    <div class="kpi k-green"><div class="bar"></div><div class="label">Available</div><div class="val">${avail}</div></div>
    <div class="kpi k-black"><div class="bar"></div><div class="label">Not Available</div><div class="val">${notAvail}</div></div>
    <div class="kpi k-amber"><div class="bar"></div><div class="label">${monthLabel(cm)} — Total Rent</div><div class="val">Tk ${fmtInt(totalRent)}</div></div>
  </div>

  <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;" class="dash-grid">
  <div class="card">
    <div class="card-head"><h3>${monthLabel(cm)} — Summary (All Flats)</h3></div>
    <div class="card-body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Particulars</th><th class="num">Amount (Tk)</th></tr></thead>
        <tbody>
          <tr><td>Total Rent Received</td><td class="num">${fmt(totalRent)}</td></tr>
          <tr><td>Common Expense</td><td class="num">${fmt(totalCommon)}</td></tr>
          <tr><td>Net Income (Rent − Common Exp.)</td><td class="num">${fmt(netIncome)}</td></tr>
          <tr><td>DhakaHome Commission / Share</td><td class="num">${fmt(commission)}</td></tr>
          <tr><td>Owner Personal Expense</td><td class="num">${fmt(totalOwnerExp)}</td></tr>
        </tbody>
        <tfoot><tr><td>Estimated Payment Due to Owner</td><td class="num">Tk ${fmt(netIncome - commission - totalOwnerExp)}</td></tr></tfoot>
      </table></div>
      ${totalFlats===0? `<div class="hint" style="margin-top:10px;">Add flats first from "Flat Management" to get started.</div>`:''}
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Cleaning Needed</h3></div>
    <div class="card-body">
      ${needsCleaning.length===0? `<div class="hint">All flats are up to date.</div>` :
        needsCleaning.map(x=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
          <div>
            <div style="font-weight:600;font-size:13.5px;">${esc(x.f.name)}</div>
            <div class="hint" style="margin-top:1px;">${x.last? 'Last cleaned: '+niceDate(x.last.date)+(x.last.cleanerName? ' by '+esc(x.last.cleanerName):'') : 'Never cleaned yet'}</div>
          </div>
          <button class="btn btn-sm btn-ghost" onclick="quickLogCleaning('${x.f.id}')">Log Cleaning</button>
        </div>`).join('')
      }
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div class="card-head"><h3>Upcoming / Active Bookings</h3></div>
    <div class="card-body">
      ${upcoming.length===0? `<div class="hint">No active bookings.</div>` : `
      <div class="tbl-wrap"><table>
        <thead><tr><th>Guest</th><th>Flat</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr></thead>
        <tbody>
        ${upcoming.map(g=>{
          const f = DB.flats.find(x=>x.id===g.flatId);
          const active = g.checkIn<=todayISO() && g.checkOut>=todayISO();
          return `<tr>
            <td>${esc(g.name)}</td>
            <td>${f?esc(f.name):'—'}</td>
            <td>${niceDate(g.checkIn)}</td>
            <td>${niceDate(g.checkOut)}</td>
            <td>${active? '<span class="badge badge-unavail"><span class="dot"></span>Staying Now</span>':'<span class="badge badge-avail"><span class="dot"></span>Upcoming</span>'}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>`}
    </div>
  </div>
  <style>@media(max-width:900px){.dash-grid{grid-template-columns:1fr !important;}}</style>
  `;
}

/* ================= FLATS ================= */
function cleanBadge(f){
  const last = getLastCleaning(f.id);
  if(!last) return `<span class="badge badge-clean-bad">Never</span>`;
  const d = daysBetween(last.date, todayISO());
  if(d<=7) return `<span class="badge badge-clean-ok">${d}d ago</span>`;
  if(d<=14) return `<span class="badge badge-clean-warn">${d}d ago</span>`;
  return `<span class="badge badge-clean-bad">${d}d ago</span>`;
}

function toggleFlatStatus(id){
  if(isViewer()){ toast('Viewer access is read-only','err'); return; }
  const f = DB.flats.find(x=>x.id===id); if(!f) return;
  f.status = f.status==='Available' ? 'Not Available' : 'Available';
  persist('flats'); render(); toast('Status updated');
}
function deleteFlat(id){
  if(isViewer()){ toast('Viewer access is read-only','err'); return; }
  const f = DB.flats.find(x=>x.id===id); if(!f) return;
  const entryCount = DB.entries.filter(e=>e.flatId===id).length;
  const cleanCount = DB.cleanings.filter(c=>c.flatId===id).length;
  const guestList = DB.guests.filter(g=>g.flatId===id);
  const guestIds = guestList.map(g=>g.id);
  const paymentCount = DB.payments.filter(p=>p.flatId===id).length;
  const guestPaymentCount = DB.guestPayments.filter(gp=>guestIds.includes(gp.guestId)).length;
  const totalRelated = entryCount + cleanCount + guestList.length + paymentCount + guestPaymentCount;
  const msg = totalRelated>0
    ? `Delete "${f.name}"?\n\nThis will PERMANENTLY delete:\n• ${entryCount} income/expense entr${entryCount===1?'y':'ies'}\n• ${cleanCount} cleaning record(s)\n• ${guestList.length} guest/booking record(s)\n• ${paymentCount} owner payment record(s)\n\nThis cannot be undone.`
    : `Delete "${f.name}"? This cannot be undone.`;
  if(!confirm(msg)) return;
  DB.flats = DB.flats.filter(x=>x.id!==id);
  DB.entries = DB.entries.filter(e=>e.flatId!==id);
  DB.cleanings = DB.cleanings.filter(c=>c.flatId!==id);
  DB.guests = DB.guests.filter(g=>g.flatId!==id);
  DB.guestPayments = DB.guestPayments.filter(gp=>!guestIds.includes(gp.guestId));
  DB.payments = DB.payments.filter(p=>p.flatId!==id);
  persist();
  render(); toast('Flat and all related records deleted','err');
}

function handleInventoryPdfUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  if(file.type !== 'application/pdf'){ toast('Please choose a PDF file','err'); evt.target.value=''; return; }
  if(file.size > 1.5*1024*1024){ toast('Please choose a PDF under 1.5MB (browser storage limit)','err'); evt.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    document.getElementById('fl_inv_data').value = e.target.result;
    document.getElementById('fl_inv_name').value = file.name;
    document.getElementById('fl_inv_current').innerHTML = '📎 Selected: '+esc(file.name);
  };
  reader.readAsDataURL(file);
}
function removeInventoryPdf(e){
  e.preventDefault();
  document.getElementById('fl_inv_data').value='';
  document.getElementById('fl_inv_name').value='';
  const fileInput = document.getElementById('fl_inv_file'); if(fileInput) fileInput.value='';
  document.getElementById('fl_inv_current').textContent='No file uploaded yet (max 1.5MB, PDF only)';
}
function saveFlat(id){
  const name = document.getElementById('fl_name').value.trim();
  if(!name){ toast('Please enter a flat name','err'); return; }
  const numOrBlank = v => v===''? null : Number(v);
  const data = {
    name,
    address: document.getElementById('fl_address').value.trim(),
    flatNo: document.getElementById('fl_flatno').value.trim(),
    areaSize: document.getElementById('fl_area').value.trim(),
    bedroom: numOrBlank(document.getElementById('fl_bed').value),
    bathroom: numOrBlank(document.getElementById('fl_bath').value),
    kitchen: numOrBlank(document.getElementById('fl_kitchen').value),
    parking: numOrBlank(document.getElementById('fl_parking').value),
    drawing: numOrBlank(document.getElementById('fl_drawing').value),
    dining: numOrBlank(document.getElementById('fl_dining').value),
    servantWashroom: numOrBlank(document.getElementById('fl_servwash').value),
    balconies: numOrBlank(document.getElementById('fl_balcony').value),
    electricity: document.getElementById('fl_elec').value,
    gas: document.getElementById('fl_gas').value,
    baseRent: Number(document.getElementById('fl_rent').value)||0,
    paymentType: document.getElementById('fl_paytype').value,
    commissionPct: document.getElementById('fl_comm').value===''? null : Number(document.getElementById('fl_comm').value),
    fixedOwnerAmount: document.getElementById('fl_fixedamt').value===''? 0 : Number(document.getElementById('fl_fixedamt').value),
    tenantAdvance: Number(document.getElementById('fl_advance').value)||0,
    status: document.getElementById('fl_status').value,
    notes: document.getElementById('fl_notes').value.trim(),
    inventoryPdfData: document.getElementById('fl_inv_data').value || '',
    inventoryPdfName: document.getElementById('fl_inv_name').value || '',
  };
  try{
    if(id){ Object.assign(DB.flats.find(x=>x.id===id), data); }
    else { DB.flats.push({id:uid(), ...data}); }
    persist('flats');
  }catch(e){
    toast('Could not save — inventory PDF may be too large for browser storage','err');
    return;
  }
  closeModal(); render(); toast('Flat saved');
}

function saveAdjustAdvance(flatId){
  const f = DB.flats.find(x=>x.id===flatId); if(!f) return;
  const date = document.getElementById('adv_date').value;
  const amount = Number(document.getElementById('adv_amount').value);
  const note = document.getElementById('adv_note').value.trim() || 'Rent adjusted from Tenant Advance';
  if(!date || !amount || amount<=0){ toast('Please enter a valid date and amount','err'); return; }
  const balance = Number(f.tenantAdvance)||0;
  if(amount > balance){ if(!confirm(`This amount (Tk ${fmt(amount)}) is more than the current advance balance (Tk ${fmt(balance)}). Continue anyway?`)) return; }
  f.tenantAdvance = balance - amount;
  DB.entries.push({ id: uid(), flatId, date, month: date.slice(0,7), particular: note, type:'rent', amount });
  persist();
  closeModal(); render(); toast('Advance adjusted against rent');
}

function printHTML(html){
  // Remove ANY existing #printArea in the document first (e.g. one left inside an
  // open modal like Flat Profile) — otherwise two elements share the id "printArea",
  // both get made visible by the print CSS, and the printout shows duplicate/blank pages.
  document.querySelectorAll('#printArea').forEach(el=>el.remove());
  const holder = document.createElement('div'); holder.id='printArea'; holder.innerHTML = `<div style="padding:10px;">${html}</div>`;
  document.body.appendChild(holder);
  window.print();
  setTimeout(()=>{ if(holder.parentNode) document.body.removeChild(holder); }, 500);
}

function handleGuestPhotoUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  if(file.size > 2*1024*1024){ toast('Please choose an image under 2MB','err'); evt.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    document.getElementById('g_photo_data').value = e.target.result;
    const prev = document.getElementById('g_photo_preview');
    prev.src = e.target.result; prev.style.display = '';
  };
  reader.readAsDataURL(file);
}
function saveGuest(id){
  const name = document.getElementById('g_name').value.trim();
  const phone = document.getElementById('g_phone').value.trim();
  const cin = document.getElementById('g_in').value;
  const cout = document.getElementById('g_out').value;
  const rentType = document.getElementById('g_rentType').value;
  const rate = Number(document.getElementById('g_rate').value)||0;
  const monthlyRate = Number(document.getElementById('g_monthlyRate').value)||0;
  const serviceCharge = Number(document.getElementById('g_service').value)||0;
  const flatId = document.getElementById('g_flat').value;
  if(!name || !phone || !cin || !cout){ toast('Please fill all required (*) fields','err'); return; }
  if(rentType==='daily' && !rate){ toast('Please enter the rate per day','err'); return; }
  if(rentType==='monthly' && !monthlyRate){ toast('Please enter the monthly rent','err'); return; }
  if(cout < cin){ toast('Check-out date must be after check-in','err'); return; }
  const conflict = findBookingConflict(flatId, cin, cout, id||null);
  if(conflict){
    toast(`Dates clash with ${conflict.name}'s booking (${niceDate(conflict.checkIn)} – ${niceDate(conflict.checkOut)}) in this flat. Choose different dates or another flat.`, 'err');
    return;
  }
  const data = {
    flatId,
    name, phone,
    photo: document.getElementById('g_photo_data').value || '',
    presentAddress: document.getElementById('g_addr_cur').value.trim(),
    permanentAddress: document.getElementById('g_addr_perm').value.trim(),
    occupation: document.getElementById('g_occ').value.trim(),
    guestCount: Number(document.getElementById('g_count').value)||1,
    checkIn: cin, checkOut: cout,
    rentType,
    perDayRate: rate,
    monthlyRate: monthlyRate,
    serviceCharge: serviceCharge,
    advancePaid: Number(document.getElementById('g_advance').value)||0,
    notes: document.getElementById('g_notes').value.trim(),
  };
  if(id){ Object.assign(DB.guests.find(x=>x.id===id), data); }
  else { data.id = uid(); data.createdAt = todayISO(); DB.guests.push(data); }
  persist('guests'); closeModal(); render(); toast('Guest entry saved');
}

function deleteGuestPayment(paymentId, guestId){
  if(!confirm('Delete this payment record?')) return;
  const p = DB.guestPayments.find(x=>x.id===paymentId);
  // If this payment auto-created a linked rent entry (advance->rent adjustment), remove that entry too.
  if(p && p.linkedEntryId){
    DB.entries = DB.entries.filter(e=>e.id!==p.linkedEntryId);
  }
  DB.guestPayments = DB.guestPayments.filter(x=>x.id!==paymentId);
  persist('guestPayments'); persist('entries'); openGuestLedger(guestId); toast('Payment deleted','err');
}

function saveGuestPayment(guestId){
  const g = DB.guests.find(x=>x.id===guestId); if(!g) return;
  const f = DB.flats.find(x=>x.id===g.flatId);
  const date = document.getElementById('gp_date').value;
  const type = document.getElementById('gp_type').value;
  const amount = Number(document.getElementById('gp_amount').value);
  const note = document.getElementById('gp_note').value.trim();
  if(!date || !amount){ toast('Please fill date and amount','err'); return; }
  if(type==='other' && !note){ toast('Please add a note — it will be shown as the payment type for "Others"','err'); return; }
  if(type==='adjustment'){
    const avail = guestAvailableAdvance(g);
    if(amount > avail){ toast(`Only Tk ${fmt(avail)} of advance is available to adjust`,'err'); return; }
  }
  const rec = {id:uid(), guestId, date, type, amount, note};
  // When advance is adjusted against rent, automatically create a matching
  // Income & Expense Entry (type: rent) for this guest's flat so it flows
  // straight into Income & Expense Entry / House Report / Owner Report.
  if(type==='adjustment' && f){
    const entryId = uid();
    DB.entries.push({
      id: entryId,
      flatId: f.id,
      date,
      month: date.slice(0,7),
      particular: note || `Advance adjusted to rent — ${g.name}`,
      type: 'rent',
      amount
    });
    rec.linkedEntryId = entryId;
  }
  DB.guestPayments.push(rec);
  persist('guestPayments'); persist('entries'); closeModal(); toast('Payment saved');
  openGuestPaymentReceipt(rec.id);
}

/* ================= ENTRIES (Income & Expense) ================= */
function renderEntries(){
  ctx.entryMonth = ctx.entryMonth || curMonth();
  ctx.entryFlat = ctx.entryFlat || (DB.flats[0] ? DB.flats[0].id : null);
  const month = ctx.entryMonth;
  const flatId = ctx.entryFlat;

  if(DB.flats.length===0){
    return `<div class="card"><div class="card-body">${emptyState('edit','Add a flat first','You need at least one flat before recording income & expense entries.')}</div></div>`;
  }

/* ================= OWNER PAYMENT REPORT (matches page 2 of sample) ================= */
function computeOwnerReport(flatId, month){
  const flat = DB.flats.find(f=>f.id===flatId);
  const list = DB.entries.filter(e=>e.month===month && e.flatId===flatId);
  const totalRent = list.filter(e=>e.type==='rent').reduce((s,e)=>s+Number(e.amount),0);
  const commonExp = list.filter(e=>e.type==='common').reduce((s,e)=>s+Number(e.amount),0);
  const personalExp = list.filter(e=>e.type==='owner').reduce((s,e)=>s+Number(e.amount),0);
  const totalIncome = totalRent - commonExp;
  const isFixed = !!(flat && flat.paymentType==='fixed');
  const commPct = (flat && flat.commissionPct!=null) ? flat.commissionPct : DB.settings.defaultCommission;
  let dhCommission, ownerShare;
  if(isFixed){
    ownerShare = Number(flat.fixedOwnerAmount)||0;
    dhCommission = totalIncome - ownerShare;
  } else {
    dhCommission = totalIncome * (commPct/100);
    ownerShare = totalIncome - dhCommission;
  }
  const paymentDue = ownerShare - personalExp;

  const pay = DB.payments.find(p=>p.flatId===flatId && p.month===month) || {};
  const dollarPayment = Number(pay.dollarPayment)||0;
  const dollarRate = Number(pay.dollarRate)||0;
  const totalPaymentBDT = dollarPayment>0 ? dollarPayment*dollarRate : paymentDue;
  const actualPayment = pay.actualPayment!==undefined && pay.actualPayment!=='' ? Number(pay.actualPayment) : totalPaymentBDT;
  const advanceOrDue = actualPayment - totalPaymentBDT;

  return {flat, totalRent, commonExp, personalExp, totalIncome, commPct, isFixed, dhCommission, ownerShare, paymentDue, dollarPayment, dollarRate, totalPaymentBDT, actualPayment, advanceOrDue, comments: pay.comments||''};
}

function cleanupUnlinkedData(){
  const flatIds = new Set(DB.flats.map(f=>f.id));
  const orphanEntries = DB.entries.filter(e=>!flatIds.has(e.flatId));
  const orphanCleanings = DB.cleanings.filter(c=>!flatIds.has(c.flatId));
  const orphanGuests = DB.guests.filter(g=>!flatIds.has(g.flatId));
  const orphanPayments = DB.payments.filter(p=>!flatIds.has(p.flatId));
  const remainingGuestIds = new Set(DB.guests.filter(g=>flatIds.has(g.flatId)).map(g=>g.id));
  const orphanGuestPayments = DB.guestPayments.filter(gp=>!remainingGuestIds.has(gp.guestId));
  const total = orphanEntries.length + orphanCleanings.length + orphanGuests.length + orphanPayments.length + orphanGuestPayments.length;
  if(total===0){ toast('No unlinked data found — everything is clean'); return; }
  const ok = confirm(`Found ${total} unlinked record(s) belonging to flats/guests that no longer exist:\n• ${orphanEntries.length} income/expense entries\n• ${orphanCleanings.length} cleaning records\n• ${orphanGuests.length} guest records\n• ${orphanPayments.length} owner payment records\n• ${orphanGuestPayments.length} guest payment records\n\nRemove them permanently? This cannot be undone.`);
  if(!ok) return;
  DB.entries = DB.entries.filter(e=>flatIds.has(e.flatId));
  DB.cleanings = DB.cleanings.filter(c=>flatIds.has(c.flatId));
  DB.guests = DB.guests.filter(g=>flatIds.has(g.flatId));
  DB.payments = DB.payments.filter(p=>flatIds.has(p.flatId));
  DB.guestPayments = DB.guestPayments.filter(gp=>remainingGuestIds.has(gp.guestId));
  persist();
  render(); toast('Unlinked data removed');
}
function fullResetAllData(){

/* ================= BACKUP / RESTORE (auto-folder via File System Access API) ================= */
const IDB_NAME = 'dh_fs_handles', IDB_STORE = 'handles';
let backupDirInfo = {name:null};
function fsApiSupported(){ return typeof window.showDirectoryPicker === 'function'; }
function idbOpen(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> res(req.result);
    req.onerror = ()=> rej(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
// On load, just peek at the stored handle's name (doesn't need permission / doesn't prompt).
if(fsApiSupported()){
  idbGet('backupDir').then(h=>{ if(h){ backupDirInfo.name = h.name; if(currentPage==='settings') render(); } }).catch(()=>{});
}
async function chooseBackupFolder(){
  if(!fsApiSupported()){ toast('Your browser does not support this — use Chrome or Edge on desktop','err'); return; }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    await idbSet('backupDir', handle);
    backupDirInfo.name = handle.name;
    toast('Backup folder set: '+handle.name);
    render();
  }catch(e){ /* user cancelled the picker — do nothing */ }
}
async function getBackupDirHandle(){
  try{
    const handle = await idbGet('backupDir');
    if(!handle) return null;
    const opts = {mode:'readwrite'};
    let perm = await handle.queryPermission(opts);
    if(perm!=='granted') perm = await handle.requestPermission(opts);
    if(perm!=='granted') return null;
    backupDirInfo.name = handle.name;
    return handle;
  }catch(e){ return null; }
}
async function exportBackup(){
  const payload = {exportedAt: new Date().toISOString(), ...DB};
  const json = JSON.stringify(payload, null, 2);
  const filename = `dhakahome-backup.json`;

  if(fsApiSupported()){
    const dirHandle = await getBackupDirHandle();
    if(dirHandle){
      try{
        const fileHandle = await dirHandle.getFileHandle(filename, {create:true});
        const writable = await fileHandle.createWritable();
        await writable.write(json);
        await writable.close();
        toast(`Backup auto-saved to "${dirHandle.name}" folder`);
        return;
      }catch(e){
        console.error(e);
        toast('Could not write to the backup folder — downloading instead','err');
      }
    }
  }
  // Fallback: normal browser download (also used if no folder chosen yet, or on unsupported browsers)
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  toast('Backup downloaded');
}
function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('This will replace current data. Continue?')) return;
      DB.flats = data.flats||[]; DB.guests = data.guests||[]; DB.entries = data.entries||[]; DB.payments = data.payments||[]; DB.cleanings = data.cleanings||[]; DB.guestPayments = data.guestPayments||[]; DB.settings = data.settings||DB.settings;
      persist(); render(); toast('Backup restored successfully');
    }catch(err){ toast('Invalid backup file','err'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
