<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root{
    --red:#C21F26;
    --red-dark:#8F1519;
    --red-light:#FDEBEC;
    --black:#141416;
    --charcoal:#232326;
    --line:#E7E5E2;
    --paper:#FBFAF8;
    --white:#FFFFFF;
    --ink:#1B1B1D;
    --ink-soft:#6B6B70;
    --green:#1E8E3E;
    --green-bg:#E7F6EC;
    --amber:#B8860B;
    --amber-bg:#FBF3E2;
    --blue:#1D5FBF;
    --blue-bg:#E9F0FC;
    --radius:10px;
    --shadow: 0 1px 2px rgba(20,20,22,.04), 0 6px 20px rgba(20,20,22,.05);
  }
  
  /* Animations & General Styles */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Arial, Calibri, 'Segoe UI', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Courier New',monospace;}
  h1,h2,h3,.disp,.brand .name,.co,.rtitle .t{font-family:'Poppins',Arial,Calibri,sans-serif;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}

  .sidebar{
    width:250px; flex-shrink:0; background:var(--black);
    color:#EDEDEE; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
    transition: transform 0.3s ease-in-out;
    z-index: 99;
  }
  .brand{
    padding:22px 20px 18px; border-bottom:1px solid #2A2A2D;
  }
  .brand .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px;height:34px;border-radius:8px;background:var(--red);
    font-family:'Poppins';font-weight:800;color:#fff;font-size:15px;margin-bottom:10px;
  }
  .brand .name{font-weight:700;font-size:16.5px;letter-spacing:.2px;color:#fff;}
  .brand .tag{font-size:11px;color:#9C9CA1;margin-top:2px;letter-spacing:.4px;text-transform:uppercase;}

  .nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .nav button{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:10px 12px;border-radius:8px;font-size:14px;color:#C7C7CC;font-weight:500;
    transition:background .2s ease, color .2s ease;
  }
  .nav button svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav button:hover{background:#1F1F22;color:#fff;}
  .nav button.active{background:var(--red);color:#fff;}
  .nav .section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6F6F75;padding:14px 12px 4px;font-weight:600;}

  .sidebar-foot{padding:14px 18px;border-top:1px solid #2A2A2D;font-size:11px;color:#78787D;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column; position:relative;}
  
  /* Mobile Overlay */
  .mobile-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,20,22,0.5); 
    z-index: 98; opacity: 0; transition: opacity 0.3s ease;
  }
  .mobile-overlay.show { display: block; opacity: 1; }

  .topbar{
    background:var(--white);border-bottom:1px solid var(--line);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;}
  .topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .content{padding:24px 28px 60px; flex:1;}

  /* ---------- Buttons ---------- */
  .btn{
    all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
    transition:transform .1s ease, background .2s ease, box-shadow .2s ease;
    font-family:Arial, Calibri, sans-serif;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(194,31,38,.25);}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-dark{background:var(--black);color:#fff;}
  .btn-dark:hover{background:#000;}
  .btn-ghost{background:var(--white);color:var(--ink);border:1px solid var(--line) !important;box-shadow:none;}
  .btn-ghost:hover{background:#F3F2EF;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red-light);}
  .btn-danger:hover{background:var(--red-light);}
  .icon-btn{all:unset;cursor:pointer;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--ink-soft); transition:background 0.2s, color 0.2s;}
  .icon-btn:hover{background:#F0EFEC;color:var(--ink);}

  /* ---------- Cards / KPIs ---------- */
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden; transition:transform 0.2s ease;}
  .kpi:hover { transform: translateY(-2px); }
  .kpi .label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .kpi .val{font-family:'Poppins';font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);}
  .kpi.k-black .bar{background:var(--black);}
  .kpi.k-green .bar{background:var(--green);}
  .kpi.k-amber .bar{background:var(--amber);}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card-head h3{margin:0;font-size:15.5px;font-weight:700;}
  .card-body{padding:18px 20px;}

  /* ---------- Table (screen) ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:700;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr{transition: background 0.15s ease;}
  tbody tr:hover{background:#FAF9F6;}
  .tbl-wrap{overflow-x:auto;}
  .num{font-family:'Courier New',monospace;font-variant-numeric:tabular-nums;text-align:right;}
  tfoot td{font-weight:700;border-top:2px solid var(--black);border-bottom:none;background:#FAF9F6;}

  /* ---------- Badges & Pulse Animation ---------- */
  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 rgba(30, 142, 62, 0.7); }
    70% { box-shadow: 0 0 0 5px rgba(30, 142, 62, 0); }
    100% { box-shadow: 0 0 0 0 rgba(30, 142, 62, 0); }
  }
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:20px;font-size:12px;font-weight:700; transition:all 0.2s ease;}
  .badge .dot{width:7px;height:7px;border-radius:50%;}
  .badge-avail{background:var(--green-bg);color:var(--green);}
  .badge-avail .dot{background:var(--green); animation: pulseDot 2s infinite;}
  .badge-unavail{background:var(--red-light);color:var(--red-dark);}
  .badge-unavail .dot{background:var(--red);}
  .badge-clean-ok{background:var(--green-bg);color:var(--green);}
  .badge-clean-warn{background:var(--amber-bg);color:var(--amber);}
  .badge-clean-bad{background:var(--red-light);color:var(--red-dark);}

  /* ---------- Forms ---------- */
  label{display:block;font-size:12.5px;font-weight:600;color:#48484D;margin-bottom:5px;}
  input,select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;font-family:Arial, Calibri, sans-serif;background:#fff;color:var(--ink);
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-light);}
  .field{margin-bottom:13px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,20,22,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto; opacity:0; transition:opacity 0.2s ease;}
  .overlay.show{display:flex; opacity:1;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3); transform:translateY(15px); transition:transform 0.3s ease;}
  .overlay.show .modal{transform:translateY(0);}
  .modal.wide{max-width:800px;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:16px;font-weight:700;}
  .modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty svg{opacity:.35;margin-bottom:10px;}
  .empty .t{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:4px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--black);color:#fff;padding:12px 18px;border-radius:9px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);}
  .toast.err::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);}

  .month-nav{display:flex;align-items:center;gap:8px;}
  .month-nav button{background:#F3F2EF;}
  .month-label{font-weight:700;font-size:14px;min-width:130px;text-align:center;font-family:'Poppins';}

  /* Receipt document look (screen) */
  .receipt-doc{background:#fff;padding:34px 34px 26px;}
  .receipt-doc .rhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:20px;}
  .receipt-doc .rhead .co{font-weight:800;font-size:20px;color:var(--black);}
  .receipt-doc .rhead .co span{color:var(--red);}
  .receipt-doc .rhead .meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .receipt-doc .rtitle{text-align:right;}
  .receipt-doc .rtitle .t{font-weight:800;font-size:16px;letter-spacing:1px;color:var(--black);text-transform:uppercase;}
  .receipt-doc .rtitle .no{font-size:12px;color:var(--ink-soft);font-family:'Courier New',monospace;margin-top:3px;}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
  .rgrid .box{background:#FAF9F6;border-radius:8px;padding:12px 14px;border:1px solid var(--line);}
  .rgrid .box h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
  .rgrid .box .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .rgrid .box .row b{font-weight:600;}
  .rtable{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .rtable th{background:#EFEFEF;color:#111;font-size:11.5px;text-transform:uppercase;padding:8px 10px;text-align:left;border:1px solid #333;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .rtable td{padding:9px 10px;border:1px solid var(--line);font-size:13.5px;}
  .rtotal{display:flex;justify-content:flex-end;}
  .rtotal table{width:280px;}
  .rtotal td{padding:6px 4px;font-size:13.5px;}
  .rtotal tr.grand td{border-top:2px solid var(--black);font-weight:800;font-size:15px;padding-top:9px;}
  .rfoot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .sign{margin-top:40px;display:flex;justify-content:space-between;}
  .sign .ln{width:180px;border-top:1px solid #999;padding-top:6px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

  /* ---------- PRINT: Fixed blank and duplicate pages ---------- */
  @media print{
    @page{ margin: 14mm 12mm; size: auto; }
    body *{visibility:hidden;}
    /* Ensure body height auto to prevent extra blank pages */
    html, body { height: auto; margin: 0; padding: 0; background: #fff; }
    
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:100%; page-break-inside: avoid; }
    
    /* Hide scrollbars & overlays */
    .overlay.show { display: block !important; position: absolute; background: none; inset: auto; padding: 0; }
    .modal { box-shadow: none; transform: none; max-width: 100%; width: 100%; margin: 0; padding: 0; }
    .modal-head, .modal-foot { display: none !important; }
    .modal-body { padding: 0; max-height: none; overflow: visible; }
    .no-print{display:none !important;}

    #printArea table{width:100%;border-collapse:collapse;font-family:Arial, Calibri, sans-serif;}
    #printArea th, #printArea td{
      border:1px solid #333 !important;
      padding:6px 8px !important;
      font-size:12px;
    }
    #printArea th{background:#EFEFEF !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    #printArea .rtable th{background:#EFEFEF !important; color:#111 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    #printArea tfoot td{border-top:2px solid #000 !important; font-weight:700;}
    #printArea .rhead{border-bottom:3px solid #C21F26 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }

  /* Responsive & Mobile Menu */
  @media (max-width:900px){
    .sidebar{position:fixed;left:-260px;transition:transform .3s ease-in-out;z-index:99;}
    .sidebar.open{transform: translateX(260px);}
    .field-row,.field-row3{grid-template-columns:1fr;}
    .rgrid{grid-template-columns:1fr;}
  }
  .menu-btn{display:none;}
  @media (max-width:900px){.menu-btn{display:inline-flex;}}

  /* ========== LOGIN / AUTH STYLES ========== */
  #loginScreen {
    position:fixed; inset:0; background:linear-gradient(135deg,#141416 0%,#1e1e22 50%,#0a0a0c 100%);
    display:flex; align-items:center; justify-content:center; z-index:9999;
  }
  #loginScreen.hidden { display:none; }
  .login-box {
    background:#fff; border-radius:16px; padding:36px 32px; width:100%; max-width:400px;
    box-shadow:0 24px 80px rgba(0,0,0,.5);
    animation: fadeUp 0.4s ease forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  .login-logo { text-align:center; margin-bottom:24px; }
  .login-logo .mark {
    display:inline-flex;align-items:center;justify-content:center;
    width:48px;height:48px;border-radius:12px;background:#C21F26;
    font-family:'Poppins';font-weight:800;color:#fff;font-size:22px;margin-bottom:10px;
  }
  .login-logo .brand-name { font-family:'Poppins';font-weight:800;font-size:20px;color:#141416; }
  .login-logo .brand-sub { font-size:12px;color:#9C9CA1;text-transform:uppercase;letter-spacing:.5px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block;font-size:12.5px;font-weight:600;color:#48484D;margin-bottom:5px; }
  .login-field input {
    width:100%;padding:10px 12px;border:1px solid #E7E5E2;border-radius:8px;
    font-size:14px;outline:none;box-sizing:border-box;
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  .login-field input:focus { border-color:#C21F26;box-shadow:0 0 0 3px #FDEBEC; }
  .login-btn {
    width:100%;padding:11px;background:#C21F26;color:#fff;border:none;border-radius:8px;
    font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;font-family:Arial,sans-serif;
    transition: background 0.2s;
  }
  .login-btn:hover { background:#8F1519; }
  .login-err { color:#C21F26;font-size:12.5px;margin-top:8px;text-align:center;display:none; }
  .login-err.show { display:block; }
  .login-footer { text-align:center;margin-top:16px;font-size:11.5px;color:#9C9CA1; }

  /* sync status indicator */
  #syncStatus {
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#9C9CA1;padding:4px 8px;
    border-radius:20px;background:#F3F2EF; transition: all 0.3s ease;
  }
  #syncStatus .dot { width:7px;height:7px;border-radius:50%;background:#9C9CA1; }
  #syncStatus.syncing .dot { background:#B8860B;animation:pulse 1s infinite; }
  #syncStatus.synced .dot { background:#1E8E3E; }
  #syncStatus.err .dot { background:#C21F26; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* user management panel */
  .user-badge {
    display:inline-flex;align-items:center;gap:6px;background:#F3F2EF;
    border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
    transition: background 0.2s;
  }
  .user-badge:hover { background:#E8E7E4; }
  .role-admin { color:#C21F26; }
  .role-user { color:#1D5FBF; }
  .role-cleaner { color:#B8860B; }
  .role-viewer { color:#1E8E3E; }
  
  .offline-banner {
    background:#B8860B;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;
    display:none;
  }
  .offline-banner.show { display:block; }
</style>
</head>
<body>

<!-- OFFLINE BANNER -->
<div class="offline-banner" id="offlineBanner">⚠ You are currently offline — data is saved locally and will sync when online.</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="mark">DH</div>
      <div class="brand-name">DhakaHome</div>
      <div class="brand-sub">Smart Accounting</div>
    </div>
    <div id="loginForm">
      <div class="login-field"><label>Username</label><input type="text" id="loginUser" placeholder="Username" autocomplete="username"></div>
      <div class="login-field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="login-err" id="loginErr"></div>
      <button class="login-btn" onclick="doLogin()">Login</button>
    </div>
    <div class="login-footer">DhakaHome USA Ltd. &copy; 2026</div>
  </div>
</div>

<!-- MAIN APP (hidden until logged in) -->
<div id="app" style="display:none; flex-direction:row;">
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMenu()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">DH</div>
      <div class="name">DhakaHome</div>
      <div class="tag">Smart Accounting</div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot" id="syncStatus"><span class="dot"></span> <span id="syncLabel">Connecting...</span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="icon-btn menu-btn" onclick="toggleMenu()">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Overview</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <div class="user-badge" id="userBadge" onclick="showUserMenu()">
          <span>👤</span>
          <span id="currentUserLabel">—</span>
          <span id="currentUserRole" class="role-admin"></span>
        </div>
        <button class="btn btn-ghost btn-sm no-viewer" onclick="exportBackup()">⬇ Export</button>
        <label class="btn btn-ghost btn-sm no-viewer" style="cursor:pointer;">
          ⬆ Import <input type="file" accept=".json" onchange="importBackup(event)" style="display:none;">
        </label>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#C21F26;">🚪 Logout</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

// ====================== SIMPLE HASH (for password) ======================
async function hashPassword(pass) {
  const enc = new TextEncoder().encode(pass + 'dh_salt_2026');
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function startCloudSync(userId){
  if(firestoreUnsubscribe) firestoreUnsubscribe();
  setSyncStatus('syncing','Connecting...');
  const docRef = db.collection('accounting_data').doc('main_db');
  firestoreUnsubscribe = docRef.onSnapshot(snap=>{

      Object.assign(DB, data);
      saveLocal(DB);

      setSyncStatus('synced','Cloud ✓ Synced');

      docRef.set(DB).catch(e=>console.error(e));
      setSyncStatus('synced','Cloud ✓ New');
    }
  }, err=>{
    console.error('Firestore error:', err);
    setSyncStatus('err','Offline mode');
  });
}

function persist(part){

}

async function doLogin(){
  const uname = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.classList.remove('show');
  if(!uname||!pass){ showLoginErr('Enter Username & Password'); return; }

  const btn = document.querySelector('.login-btn');
  btn.textContent='Verifying...'; btn.disabled=true;

  try{
    const hash = await hashPassword(pass);
    if(uname===DEFAULT_ADMIN.username && pass===DEFAULT_ADMIN.password){
      loginSuccess({username:uname, role:'admin'});
      return;
    }
    const doc = await db.collection('dh_users').doc(uname).get();
    if(!doc.exists){ showLoginErr('User not found'); btn.textContent='Login'; btn.disabled=false; return; }
    const userData = doc.data();
    if(!userData.active){ showLoginErr('Account inactive'); btn.textContent='Login'; btn.disabled=false; return; }
    if(userData.passwordHash !== hash){ showLoginErr('Incorrect Password'); btn.textContent='Login'; btn.disabled=false; return; }
    loginSuccess({username:uname, role:userData.role||'user'});
  }catch(e){
    if(uname===DEFAULT_ADMIN.username && pass===DEFAULT_ADMIN.password){
      loginSuccess({username:uname, role:'admin'}); return;
    }
    showLoginErr('Login failed — Check internet connection');
    btn.textContent='Login'; btn.disabled=false;
  }
}

function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtInt(n){ n=Number(n)||0; return n.toLocaleString('en-US'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ if(!a||!b) return 0; const d1=new Date(a), d2=new Date(b); return Math.max(0, Math.round((d2-d1)/86400000)); }
function niceDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function monthLabel(ym){ if(!ym) return '—'; const [y,m]=ym.split('-'); const d=new Date(Number(y),Number(m)-1,1); return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function curMonth(){ return new Date().toISOString().slice(0,7); }
function shiftMonth(ym, delta){ const [y,m]=ym.split('-').map(Number); const d=new Date(y, m-1+delta, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function toast(msg, type){
  const t=document.getElementById('toast');

/* ---------------- Helpers ---------------- */
function getLastCleaning(flatId){
  const list = DB.cleanings.filter(c=>c.flatId===flatId).sort((a,b)=> b.date.localeCompare(a.date));
  return list[0] || null;
}
function findBookingConflict(flatId, checkIn, checkOut, excludeGuestId){
  return DB.guests.find(g=>{
    if(g.flatId!==flatId) return false;
    if(excludeGuestId && g.id===excludeGuestId) return false;
    return (checkIn < g.checkOut) && (checkOut > g.checkIn);
  }) || null;
}
function guestDays(g){ return Math.max(1, daysBetween(g.checkIn, g.checkOut)); }
function guestTotalRent(g){
  const days = guestDays(g);
  let base = (g.rentType==='monthly') ? Math.round((Number(g.monthlyRate)||0) * (days/30)) : days * Number(g.perDayRate||0);
  return base + Number(g.serviceCharge||0);
}
function guestRateLabel(g){ return g.rentType==='monthly' ? `Tk ${fmt(g.monthlyRate)} / month` : `Tk ${fmt(g.perDayRate)} / day`; }
function guestLedger(guestId){ return DB.guestPayments.filter(p=>p.guestId===guestId).sort((a,b)=>a.date.localeCompare(b.date)); }
function guestTotalReceived(g){
  const ledger = guestLedger(g.id);
  const later = ledger.filter(p=>p.type==='advance'||p.type==='rent').reduce((s,p)=>s+Number(p.amount),0);
  return Number(g.advancePaid||0) + later;
}
function guestRentPaid(g){
  return guestLedger(g.id).filter(p=>p.type==='rent'||p.type==='adjustment').reduce((s,p)=>s+Number(p.amount),0);
}
function guestAvailableAdvance(g){
  const ledger = guestLedger(g.id);
  const advanceIn = Number(g.advancePaid||0) + ledger.filter(p=>p.type==='advance').reduce((s,p)=>s+Number(p.amount),0);
  const advanceUsed = ledger.filter(p=>p.type==='adjustment').reduce((s,p)=>s+Number(p.amount),0);
  return Math.max(0, advanceIn - advanceUsed);
}
function guestBalanceDue(g){ return guestTotalRent(g) - guestRentPaid(g); }

function renderDashboard(role){
  const totalFlats = DB.flats.length;
  const avail = DB.flats.filter(f=>f.status==='Available').length;
  const notAvail = totalFlats - avail;
  const cm = curMonth();
  const monthEntries = DB.entries.filter(e=>e.month===cm);
  
  const totalRent = monthEntries.filter(e=>e.type==='rent').reduce((s,e)=>s+Number(e.amount),0);
  const totalCommon = monthEntries.filter(e=>e.type==='common').reduce((s,e)=>s+Number(e.amount),0);
  const totalOwnerExp = monthEntries.filter(e=>e.type==='owner').reduce((s,e)=>s+Number(e.amount),0);
  const netIncome = totalRent - totalCommon;
  
  // Calculate total commission considering both % and Fixed types
  const commission = DB.flats.reduce((sum, f) => {
    const list = monthEntries.filter(e=>e.flatId === f.id);
    const r = list.filter(e=>e.type==='rent').reduce((s,e)=>s+Number(e.amount),0);
    const c = list.filter(e=>e.type==='common').reduce((s,e)=>s+Number(e.amount),0);
    const inc = r - c;
    if(f.commType === 'fixed') { return sum + (inc > 0 ? (Number(f.commValue)||0) : 0); }
    else { return sum + (inc * ((Number(f.commValue)||DB.settings.defaultCommission)/100)); }
  }, 0);

  const needsCleaning = DB.flats.map(f=>({f, last:getLastCleaning(f.id)}))
    .filter(x=> !x.last || daysBetween(x.last.date, todayISO()) >= 7)
    .sort((a,b)=> (a.last?a.last.date:'0000-00-00').localeCompare(b.last?b.last.date:'0000-00-00'))
    .slice(0,6);

  const upcoming = DB.guests.filter(g=> g.checkOut >= todayISO()).sort((a,b)=> a.checkIn.localeCompare(b.checkIn)).slice(0,6);

  let html = `
  <div class="grid-kpi">
    <div class="kpi"><div class="bar"></div><div class="label">Total Flats</div><div class="val">${totalFlats}</div></div>
    <div class="kpi k-green"><div class="bar"></div><div class="label">Available</div><div class="val">${avail}</div></div>
    <div class="kpi k-black"><div class="bar"></div><div class="label">Not Available</div><div class="val">${notAvail}</div></div>
    ${role!=='viewer' ? `<div class="kpi k-amber"><div class="bar"></div><div class="label">${monthLabel(cm)} — Total Rent</div><div class="val">Tk ${fmtInt(totalRent)}</div></div>` : ''}
  </div>
  <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;" class="dash-grid">`;

  if(role !== 'viewer') {
    html += `
    <div class="card">
      <div class="card-head"><h3>${monthLabel(cm)} — Financial Summary</h3></div>
      <div class="card-body">
        <div class="tbl-wrap"><table>
          <thead><tr><th>Particulars</th><th class="num">Amount (Tk)</th></tr></thead>
          <tbody>
            <tr><td>Total Rent Received</td><td class="num">${fmt(totalRent)}</td></tr>
            <tr><td>Common Expense</td><td class="num">${fmt(totalCommon)}</td></tr>
            <tr><td>Net Income (Rent − Common Exp.)</td><td class="num">${fmt(netIncome)}</td></tr>
            <tr><td>DhakaHome Commission (Calculated)</td><td class="num">${fmt(commission)}</td></tr>
            <tr><td>Owner Personal Expense</td><td class="num">${fmt(totalOwnerExp)}</td></tr>
          </tbody>
          <tfoot><tr><td>Estimated Payment Due to Owners</td><td class="num">Tk ${fmt(netIncome - commission - totalOwnerExp)}</td></tr></tfoot>
        </table></div>
      </div>
    </div>`;
  }

  html += `
    <div class="card" ${role==='viewer'?'style="grid-column:1/-1"':''}>
      <div class="card-head"><h3>Cleaning Alerts</h3></div>
      <div class="card-body">
        ${needsCleaning.length===0? `<div class="hint">All flats are up to date.</div>` :
          needsCleaning.map(x=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
            <div>
              <div style="font-weight:600;font-size:13.5px;">${esc(x.f.name)}</div>
              <div class="hint" style="margin-top:1px;">${x.last? 'Last cleaned: '+niceDate(x.last.date) : 'Never cleaned yet'}</div>
            </div>
          </div>`).join('')
        }
      </div>
    </div>`;

  if(role !== 'viewer') {
    html += `
    <div class="card" style="grid-column:1/-1; margin-top:16px;">
      <div class="card-head"><h3>Upcoming / Active Bookings</h3></div>
      <div class="card-body">
        ${upcoming.length===0? `<div class="hint">No active bookings.</div>` : `
        <div class="tbl-wrap"><table>
          <thead><tr><th>Guest</th><th>Flat</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr></thead>
          <tbody>
          ${upcoming.map(g=>{
            const f = DB.flats.find(x=>x.id===g.flatId);
            const active = g.checkIn<=todayISO() && g.checkOut>=todayISO();
            return `<tr>
              <td>${esc(g.name)}</td><td>${f?esc(f.name):'—'}</td><td>${niceDate(g.checkIn)}</td><td>${niceDate(g.checkOut)}</td>
              <td>${active? '<span class="badge badge-unavail"><span class="dot"></span>Staying Now</span>':'<span class="badge badge-avail"><span class="dot"></span>Upcoming</span>'}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>`;
  }
  
  html += `</div><style>@media(max-width:900px){.dash-grid{grid-template-columns:1fr !important;}}</style>`;
  return html;
}

/* ================= FLATS ================= */
function cleanBadge(f){
  const last = getLastCleaning(f.id);
  if(!last) return `<span class="badge badge-clean-bad">Never</span>`;
  const d = daysBetween(last.date, todayISO());
  if(d<=7) return `<span class="badge badge-clean-ok">${d}d ago</span>`;
  if(d<=14) return `<span class="badge badge-clean-warn">${d}d ago</span>`;
  return `<span class="badge badge-clean-bad">${d}d ago</span>`;
}

  return `
  <div class="card">

      <h3>Flat List (${rows.length})</h3>

      </div>
    </div>
    <div class="card-body">
      ${rows.length===0? emptyState('home','No flats yet','Add your first flat here.') : `
      <div class="tbl-wrap"><table>
        <thead><tr>
          <th>Flat / Address</th><th>Base Rent</th><th>Commission</th><th>Status</th><th>Cleaning</th><th></th>

        ${rows.map(f=>`
          <tr>

              ${detailBits(f)? `<div class="hint" style="margin-top:2px;">${esc(detailBits(f))}</div>`:''}

              ` : ''}
            </td>
          </tr>
        `).join('')}
        </tbody>
      </table></div>`}
    </div>
  </div>`;
}

function toggleFlatStatus(id){
  const f = DB.flats.find(x=>x.id===id); if(!f) return;
  f.status = f.status==='Available' ? 'Not Available' : 'Available';
  persist('flats'); render(); toast('Status updated');
}

function deleteFlat(id){
  const f = DB.flats.find(x=>x.id===id); if(!f) return;
  if(!confirm(`Delete "${f.name}"? This cannot be undone.`)) return;
  DB.flats = DB.flats.filter(x=>x.id!==id);
  DB.entries = DB.entries.filter(e=>e.flatId!==id);
  DB.cleanings = DB.cleanings.filter(c=>c.flatId!==id);
  DB.guests = DB.guests.filter(g=>g.flatId!==id);
  DB.payments = DB.payments.filter(p=>p.flatId!==id);
  persist(); render(); toast('Flat deleted','err');
}

function saveFlat(id){
  const name = document.getElementById('fl_name').value.trim();
  if(!name){ toast('Please enter a flat name','err'); return; }
  const numOrBlank = v => v===''? null : Number(v);
  const data = {
    name,
    address: document.getElementById('fl_address').value.trim(),
    flatNo: document.getElementById('fl_flatno').value.trim(),
    areaSize: document.getElementById('fl_area').value.trim(),
    bedroom: numOrBlank(document.getElementById('fl_bed').value),
    bathroom: numOrBlank(document.getElementById('fl_bath').value),
    kitchen: numOrBlank(document.getElementById('fl_kitchen').value),
    parking: numOrBlank(document.getElementById('fl_parking').value),
    drawing: numOrBlank(document.getElementById('fl_drawing').value),
    dining: numOrBlank(document.getElementById('fl_dining').value),
    servant: numOrBlank(document.getElementById('fl_servant').value),
    balcony: numOrBlank(document.getElementById('fl_balcony').value),
    elec: document.getElementById('fl_elec').value,
    gas: document.getElementById('fl_gas').value,
    baseRent: Number(document.getElementById('fl_rent').value)||0,
    commType: document.getElementById('fl_commType').value,
    commValue: document.getElementById('fl_comm').value===''? null : Number(document.getElementById('fl_comm').value),
    status: document.getElementById('fl_status').value,
    notes: document.getElementById('fl_notes').value.trim()
  };
  if(id) Object.assign(DB.flats.find(x=>x.id===id), data);
  else DB.flats.push({id:uid(), ...data});
  persist('flats'); closeModal(); render(); toast('Flat saved');
}

function printHTML(html){
  const holder = document.createElement('div'); holder.id='printArea'; 
  holder.innerHTML = `<div style="padding:10px;">${html}</div>`;
  document.body.appendChild(holder);
  window.print();
  setTimeout(()=>{ if(holder.parentNode) document.body.removeChild(holder); }, 500);
}

function openCleaningForm(id, presetFlatId){

  const c = id ? DB.cleanings.find(x=>x.id===id) : null;
  const flatId = c ? c.flatId : (presetFlatId || DB.flats[0].id);
  // Cleaner default name to logged in username
  const defName = currentUser.role==='cleaner' ? currentUser.username : '';
  openModal(`
    <div class="modal-head"><h3>${c?'Edit Cleaning Record':'Log Cleaning'}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Select Flat *</label>
        <select id="cl_flat">${DB.flats.map(f=>`<option value="${f.id}" ${f.id===flatId?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Date *</label><input id="cl_date" type="date" value="${c?c.date:todayISO()}"></div>
        <div class="field"><label>Cleaner Name</label><input id="cl_name" value="${c?esc(c.cleanerName||''):defName}"></div>

      <div class="field"><label>Notes</label><textarea id="cl_notes" rows="2">${c?esc(c.notes||''):''}</textarea></div>

function saveCleaning(id){
  const date = document.getElementById('cl_date').value;
  if(!date){ toast('Please pick a date','err'); return; }
  const data = {
    flatId: document.getElementById('cl_flat').value,
    date,
    cleanerName: document.getElementById('cl_name').value.trim(),
    notes: document.getElementById('cl_notes').value.trim(),
  };
  if(id) Object.assign(DB.cleanings.find(x=>x.id===id), data);
  else { data.id = uid(); DB.cleanings.push(data); }
  persist('cleanings'); closeModal(); render(); toast('Cleaning record saved');
}

function deleteCleaning(id){
  if(!confirm('Delete this cleaning record?')) return;
  DB.cleanings = DB.cleanings.filter(x=>x.id!==id); persist('cleanings'); render(); toast('Record deleted','err');
}

          const f = DB.flats.find(x=>x.id===c.flatId);
          return `<tr>
            <td>${niceDate(c.date)}</td>
            <td>${f?esc(f.name):'<i>Deleted flat</i>'}</td>
            <td>${esc(c.cleanerName||'—')}</td>
            <td>${esc(c.notes||'—')}</td>
            <td style="text-align:right;white-space:nowrap;">
              ${role!=='viewer' ? `
              <button class="icon-btn" onclick="openCleaningForm('${c.id}')">${ICONS.penEdit}</button>
              <button class="icon-btn" onclick="deleteCleaning('${c.id}')" style="color:var(--red);">${ICONS.trash}</button>
              ` : ''}
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
    </div>
  </div>`;
}

/* ================= GUESTS / BOOKING ================= */
function renderGuests(){
  const rows = [...DB.guests].sort((a,b)=> b.checkIn.localeCompare(a.checkIn));
  return `
  <div class="card">
    <div class="card-head">
      <h3>Guest / Booking List (${rows.length})</h3>
      <button class="btn btn-primary btn-sm" onclick="openGuestForm()">${ICONS.plus} New Guest Entry</button>
    </div>
    <div class="card-body">
      ${DB.flats.length===0? `<div class="hint">Add a flat first, then you can create guest entries.</div>` : rows.length===0? emptyState('users','No guest entries yet','Create a new guest entry to log check-in/out.') : `
      <div class="tbl-wrap"><table>
        <thead><tr><th>Guest</th><th>Flat</th><th>Check-in</th><th>Check-out</th><th>Balance Due</th><th></th></tr></thead>
        <tbody>
        ${rows.map(g=>{
          const f = DB.flats.find(x=>x.id===g.flatId);
          const due = guestBalanceDue(g);
          return `<tr>
            <td><div style="font-weight:700;">${esc(g.name)}</div><div class="hint">${esc(g.phone||'')}</div></td>
            <td>${f?esc(f.name):'<i>Deleted flat</i>'}</td>
            <td>${niceDate(g.checkIn)}</td>
            <td>${niceDate(g.checkOut)}</td>
            <td class="num" style="color:${due>0?'var(--red)':'var(--green)'};font-weight:700;">Tk ${fmtInt(due)}</td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="btn btn-sm btn-ghost" onclick="openGuestLedger('${g.id}')">Payments</button>
              <button class="icon-btn" onclick="openGuestForm('${g.id}')">${ICONS.penEdit}</button>
              <button class="icon-btn" onclick="deleteGuest('${g.id}')" style="color:var(--red);">${ICONS.trash}</button>
            </td>
          </tr>`;

      </table></div>`}

function openGuestForm(id){
  const g = id ? DB.guests.find(x=>x.id===id) : null;
  if(DB.flats.length===0){ toast('Add a flat first','err'); return; }
  const rentType = g? (g.rentType||'daily') : 'daily';
  openModal(`
    <div class="modal-head"><h3>${g?'Edit Guest':'New Guest Entry'}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Select Flat *</label>
        <select id="g_flat">${DB.flats.map(f=>`<option value="${f.id}" ${g&&g.flatId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Guest Name *</label><input id="g_name" value="${g?esc(g.name):''}"></div>
        <div class="field"><label>Mobile Number *</label><input id="g_phone" value="${g?esc(g.phone||''):''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Check-in *</label><input id="g_in" type="date" value="${g?g.checkIn:todayISO()}"></div>
        <div class="field"><label>Check-out *</label><input id="g_out" type="date" value="${g?g.checkOut:''}"></div>
      </div>
      <div class="field"><label>Rent System *</label>
        <select id="g_rentType" onchange="toggleGuestRentFields()">
          <option value="daily" ${rentType==='daily'?'selected':''}>Per Day Rent</option>
          <option value="monthly" ${rentType==='monthly'?'selected':''}>Monthly Rent</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field" id="g_dailyField"><label>Rate per Day (Tk)</label><input id="g_rate" type="number" value="${g?g.perDayRate||'':''}"></div>
        <div class="field" id="g_monthlyField"><label>Monthly Rent (Tk)</label><input id="g_monthlyRate" type="number" value="${g?g.monthlyRate||'':''}"></div>
        <div class="field"><label>Service Charge (Tk)</label><input id="g_service" type="number" value="${g?g.serviceCharge||'':''}" placeholder="e.g. 500"></div>
      </div>
      <div class="field"><label>Advance Paid (Tk)</label><input id="g_advance" type="number" value="${g?g.advancePaid||0:0}"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="saveGuest(${g?`'${g.id}'`:'null'})">Save</button>
    </div>
  `);
  toggleGuestRentFields();
}

function toggleGuestRentFields(){
  const type = document.getElementById('g_rentType').value;
  document.getElementById('g_dailyField').style.display = type==='daily' ? '' : 'none';
  document.getElementById('g_monthlyField').style.display = type==='monthly' ? '' : 'none';
}

function saveGuest(id){
  const name = document.getElementById('g_name').value.trim();
  const phone = document.getElementById('g_phone').value.trim();
  const cin = document.getElementById('g_in').value;
  const cout = document.getElementById('g_out').value;
  const rentType = document.getElementById('g_rentType').value;
  if(!name || !phone || !cin || !cout) return toast('Fill all required fields','err');
  
  const data = {
    flatId: document.getElementById('g_flat').value,
    name, phone, checkIn: cin, checkOut: cout, rentType,
    perDayRate: Number(document.getElementById('g_rate').value)||0,
    monthlyRate: Number(document.getElementById('g_monthlyRate').value)||0,
    serviceCharge: Number(document.getElementById('g_service').value)||0,
    advancePaid: Number(document.getElementById('g_advance').value)||0
  };
  
  if(id) Object.assign(DB.guests.find(x=>x.id===id), data);
  else { data.id = uid(); DB.guests.push(data); }
  persist('guests'); closeModal(); render(); toast('Guest entry saved');
}

function deleteGuest(id){
  if(!confirm('Delete this guest entry?')) return;
  DB.guests = DB.guests.filter(x=>x.id!==id);
  DB.guestPayments = DB.guestPayments.filter(x=>x.guestId!==id);
  persist(); render(); toast('Deleted','err');
}

/* ================= GUEST LEDGER ================= */
function openGuestLedger(id){
  const g = DB.guests.find(x=>x.id===id); if(!g) return;
  const ledger = guestLedger(id);
  const due = guestBalanceDue(g);
  openModal(`
    <div class="modal-head"><h3>Account Summary — ${esc(g.name)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="rgrid" style="margin-bottom:16px;">
        <div class="box">
          <h4>Billing</h4>
          <div class="row"><span>Total Bill</span><b>Tk ${fmt(guestTotalRent(g))}</b></div>
          <div class="row"><span>Balance Due</span><b style="color:${due>0?'var(--red)':'var(--green)'}">Tk ${fmt(due)}</b></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <b>Payment History</b>
        <button class="btn btn-primary btn-sm" onclick="openAddGuestPayment('${id}')">+ Add Payment</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Type</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody>
        ${ledger.map(p=>`<tr>
          <td>${niceDate(p.date)}</td><td>${p.type}</td><td class="num">Tk ${fmt(p.amount)}</td>
          <td style="text-align:right;"><button class="icon-btn" onclick="deleteGuestPayment('${p.id}','${id}')" style="color:var(--red);">${ICONS.trash}</button></td>
        </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
  `, true);
}

function openAddGuestPayment(guestId){
  openModal(`
    <div class="modal-head"><h3>Add Payment</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Date *</label><input id="gp_date" type="date" value="${todayISO()}"></div>
      <div class="field"><label>Type</label><select id="gp_type"><option value="rent">Rent Payment</option><option value="advance">Advance</option></select></div>
      <div class="field"><label>Amount (Tk) *</label><input id="gp_amount" type="number"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="saveGuestPayment('${guestId}')">Save</button></div>
  `);
}
function saveGuestPayment(guestId){
  DB.guestPayments.push({
    id:uid(), guestId, date:document.getElementById('gp_date').value,
    type:document.getElementById('gp_type').value, amount:Number(document.getElementById('gp_amount').value)
  });
  persist('guestPayments'); closeModal(); openGuestLedger(guestId); toast('Saved');
}
function deleteGuestPayment(pid, gid){
  DB.guestPayments = DB.guestPayments.filter(x=>x.id!==pid);
  persist('guestPayments'); openGuestLedger(gid); toast('Deleted');
}

  ctx.entryFlat = ctx.entryFlat || (DB.flats[0] ? DB.flats[0].id : null);

function deleteEntry(id){

/* ================= HOUSE REPORT ================= */

  ctx.entryMonth = ctx.entryMonth || curMonth();
  ctx.entryFlat = ctx.entryFlat || (DB.flats[0]?DB.flats[0].id:null);
  const month = ctx.entryMonth, flatId = ctx.entryFlat;
  if(DB.flats.length===0) return `<div class="card"><div class="card-body">Add a flat first.</div></div>`;
  
  const list = DB.entries.filter(e=>e.month===month && e.flatId===flatId);
  const totalRent = list.filter(e=>e.type==='rent').reduce((s,e)=>s+Number(e.amount),0);
  const totalCommon = list.filter(e=>e.type==='common').reduce((s,e)=>s+Number(e.amount),0);

  return `
  <div class="card">

        <select style="width:auto;min-width:220px;" onchange="ctx.entryFlat=this.value; render();">
          ${DB.flats.map(f=>`<option value="${f.id}" ${f.id===flatId?'selected':''}>${esc(f.name)}</option>`).join('')}
        </select>
        <div class="month-nav">
          <button class="icon-btn" onclick="ctx.entryMonth=shiftMonth(ctx.entryMonth,-1); render();">‹</button>
          <div class="month-label">${monthLabel(month)}</div>
          <button class="icon-btn" onclick="ctx.entryMonth=shiftMonth(ctx.entryMonth,1); render();">›</button>
        </div>
        <button class="btn btn-dark btn-sm" onclick="printHTML(document.getElementById('hr_print').innerHTML)">Print</button>
      </div>
    </div>
    <div class="card-body" id="hr_print">
      <div style="margin-bottom:14px; font-weight:800;">${DB.flats.find(f=>f.id===flatId)?.name}</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Particulars</th><th class="num">Rent</th><th class="num">Common Exp.</th></tr></thead>
        <tbody>
        ${list.map(e=>`<tr><td>${esc(e.particular)}</td><td class="num">${e.type==='rent'?fmt(e.amount):''}</td><td class="num">${e.type==='common'?fmt(e.amount):''}</td></tr>`).join('')}
        </tbody>
        <tfoot><tr><td>Total</td><td class="num">${fmt(totalRent)}</td><td class="num">${fmt(totalCommon)}</td></tr></tfoot>
      </table></div>
    </div>
  </div>`;
}

/* ================= OWNER REPORT (Pct vs Fixed Support) ================= */
function computeOwnerReport(flatId, month){
  const flat = DB.flats.find(f=>f.id===flatId);
  const list = DB.entries.filter(e=>e.month===month && e.flatId===flatId);
  const totalRent = list.filter(e=>e.type==='rent').reduce((s,e)=>s+Number(e.amount),0);
  const commonExp = list.filter(e=>e.type==='common').reduce((s,e)=>s+Number(e.amount),0);
  const personalExp = list.filter(e=>e.type==='owner').reduce((s,e)=>s+Number(e.amount),0);
  const totalIncome = totalRent - commonExp;
  
  let dhCommission = 0;
  if(flat && flat.commType === 'fixed') {
    dhCommission = totalIncome > 0 ? (Number(flat.commValue)||0) : 0;
  } else {
    dhCommission = totalIncome * ((flat?.commValue??DB.settings.defaultCommission)/100);
  }
  
  const ownerShare = totalIncome - dhCommission;
  const paymentDue = ownerShare - personalExp;

  return {flat, totalRent, commonExp, personalExp, totalIncome, dhCommission, ownerShare, paymentDue};
}

function renderOwnerReport(){
  ctx.entryMonth = ctx.entryMonth || curMonth();
  ctx.entryFlat = ctx.entryFlat || (DB.flats[0]?DB.flats[0].id:null);
  const month = ctx.entryMonth, flatId = ctx.entryFlat;
  if(DB.flats.length===0) return `<div class="card"><div class="card-body">Add a flat first.</div></div>`;
  
  const r = computeOwnerReport(flatId, month);
  const commLbl = r.flat && r.flat.commType === 'fixed' ? 'Fixed Tk ' + fmt(r.flat.commValue) : (r.flat?.commValue??DB.settings.defaultCommission) + '%';

  return `
  <div class="card">
    <div class="card-head">
      <h3>Owner Payment Report</h3>
      <div style="display:flex;gap:8px;align-items:center;">
        <select style="width:auto;min-width:220px;" onchange="ctx.entryFlat=this.value; render();">
          ${DB.flats.map(f=>`<option value="${f.id}" ${f.id===flatId?'selected':''}>${esc(f.name)}</option>`).join('')}
        </select>
        <div class="month-nav">
          <button class="icon-btn" onclick="ctx.entryMonth=shiftMonth(ctx.entryMonth,-1); render();">‹</button>
          <div class="month-label">${monthLabel(month)}</div>
          <button class="icon-btn" onclick="ctx.entryMonth=shiftMonth(ctx.entryMonth,1); render();">›</button>
        </div>
        <button class="btn btn-dark btn-sm" onclick="printHTML(document.getElementById('or_print').innerHTML)">Print</button>
      </div>
    </div>
    <div class="card-body" id="or_print">
      <div style="margin-bottom:14px;">
        <div style="font-weight:800;">${r.flat?esc(r.flat.name):''}</div>
        <div class="hint">Comm: ${commLbl}</div>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Rent</th><th>Common Exp.</th><th>Net Income</th><th>DH Comm.</th><th>Owner Share</th><th>Personal Exp.</th><th>Payment Due</th></tr></thead>
        <tbody>
          <tr>
            <td>${fmt(r.totalRent)}</td><td>${fmt(r.commonExp)}</td><td>${fmt(r.totalIncome)}</td>
            <td>${fmt(r.dhCommission)}</td><td>${fmt(r.ownerShare)}</td><td>${fmt(r.personalExp)}</td>
            <td style="font-weight:800;">${fmt(r.paymentDue)}</td>
          </tr>
        </tbody>
      </table></div>
    </div>
  </div>`;
}

/* ================= SETTINGS ================= */
